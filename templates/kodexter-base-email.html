<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{SubjectLine}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#344054;">
    <div style="display:none;max-height:0;overflow:hidden;color:transparent;">
      {{Preheader}}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #eaecf0;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:18px 24px;">
                <strong style="color:#155eef;font-size:18px;">{{LogoText}}</strong>
                <div style="float:right;text-align:right;font-size:12px;color:#667085;line-height:1.45;">
                  <strong>{{CampaignName}}</strong><br>
                  {{SenderName}}<br>
                  {{SenderIdentity}}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 24px;background:#155eef;color:#ffffff;">
                <h1 style="margin:0 0 8px;font-size:30px;line-height:1.15;color:#ffffff;">{{BannerHeadline}}</h1>
                <p style="margin:0;color:#eaf2ff;font-size:15px;line-height:1.55;">{{Preheader}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 24px;font-size:16px;line-height:1.6;">
                <h2 style="margin:0 0 14px;color:#101828;font-size:24px;line-height:1.25;">{{MainHeading}}</h2>
                {{BodyHtml}}
                {{BulletHtml}}
                <p style="margin:28px 0 0;">
                  <a href="{{PrimaryUrl}}" style="display:inline-block;background:#155eef;color:#ffffff;text-decoration:none;padding:13px 18px;border-radius:6px;font-weight:bold;">{{PrimaryCta}}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 24px;border-top:1px solid #eaecf0;color:#667085;font-size:12px;line-height:1.5;">
                Kodexter Technologies Pvt. Ltd. | You are receiving this email because you connected with Kodexter.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
